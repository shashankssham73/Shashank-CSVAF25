<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Paper Cut — visual test</title>
<!-- Same origin as the page under test, so the layout can be driven directly.
     Geometry and tools are far easier to check by looking than by asserting:
     the Node tests prove area is conserved and that a tool round-trips, this
     proves both are DRAWN where they should be.
     No window feeds here on purpose — they long-poll, which keeps a headless
     render from ever settling. -->
<style>html,body{margin:0;background:#0a0d14}iframe{border:0;display:block}</style>
</head><body>
<iframe id="f" src="/m1/papercut.html" width="1280" height="700"></iframe>
<script>
const f = document.getElementById('f');
f.onload = () => setTimeout(() => {
  const pc = f.contentWindow.papercut;
  if (!pc) { document.title = 'FAILED: no papercut handle'; return; }
  pc.cut(0.34, 0, 0.30, 1);
  pc.cut(0, 0.40, 1, 0.46);
  pc.cut(0.68, 0.46, 0.78, 1);
  pc.punch('hexagon', 0.52, 0.70, 0.10);

  const panes = pc.layout.panes;
  pc.tool(panes[0].id, 'clock');
  pc.tool(panes[1].id, 'fill');   // not the meter: it opens an SSE stream and headless never settles
  pc.tool(panes[2].id, 'note');
  if (panes[3]) pc.tool(panes[3].id, 'fill');
  const n = panes.filter(p => p.source && p.source.t === 'tool').length;
  document.title = `${panes.length} pieces, ${n} tools`;
}, 500);
</script>
</body></html>
