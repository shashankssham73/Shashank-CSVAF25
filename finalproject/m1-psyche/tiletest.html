<!doctype html>
<html><head><meta charset="utf-8"><title>reader + tile self test</title>
<style>body{background:#0b0e12;color:#cfe;font:13px ui-monospace,Menlo,monospace;padding:18px}
.ok{color:#6fbf86}.bad{color:#cf6b5e}canvas{border:1px solid #2c343d;margin:6px;width:300px}</style>
</head><body><pre id="o">…</pre><div id="c"></div>
<script>window.onerror=(m,s,l,c)=>{document.getElementById('o').textContent='CRASH: '+m;
 fetch('/selftest',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({suite:'CRASH',summary:'0/0',tests:[{name:'page threw',pass:false,detail:String(m)+' @'+l}]})});};</script>
<script type="module">
import { TileLayer } from './tilelayer.js';
import { applySurfaceStack, surfIdentity } from './modulate.js';
import { matches } from '../m0-telemetry/patch/selection.js';

const r = { suite:'readers-tiles', tests:[] };
const T=(n,p,d)=>{r.tests.push({name:n,pass:p,detail:d});
  document.getElementById('o').innerHTML = r.tests.map(t=>
   `<span class="${t.pass?'ok':'bad'}">${t.pass?' ok  ':'FAIL '}${t.name}</span>\n       ${t.detail||''}`).join('\n');};

const W=960,H=600;
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c;};
// a source with obvious structure: bright blocks on dark, so brightness
// selections have something to bite on
const paint = (c,w,h) => {
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle='#0a0d14'; c.fillRect(0,0,w,h);
  for (let i=0;i<10;i++){
    c.fillStyle = i%2 ? '#e8f2ff' : '#2b6f8c';
    c.fillRect((i%5)*w/5 + 12, Math.floor(i/5)*h/2 + 14, w/5-24, h/2-28);
  }
  c.fillStyle='#ffb347'; c.fillRect(w*0.4, h*0.42, w*0.2, h*0.16);
};
const ink = ctx => { const d=ctx.getImageData(0,0,W,H).data; let n=0;
  for(let i=0;i<d.length;i+=4) if(d[i]>28||d[i+1]>34||d[i+2]>44) n++; return n; };
const diff = (a,b) => { const x=a.getImageData(0,0,W,H).data,y=b.getImageData(0,0,W,H).data;
  let n=0; for(let i=0;i<x.length;i+=4)
    if(Math.abs(x[i]-y[i])+Math.abs(x[i+1]-y[i+1])+Math.abs(x[i+2]-y[i+2])>24) n++; return n; };

const tl = new TileLayer(512, 320);

// 1. no reader, no units — nothing changes about how anything renders
T('with no reader active, nothing is read', tl.sample(paint, []).length === 0 && tl.img === null,
  'the readers are opt-in; an empty patch costs nothing');

// 2. a grid reader produces units
const grid = tl.sample(paint, [{ kind:'grid', cols:16, rows:10, ax:0, ay:0, aw:1, ah:1 }], W, H);
T('a grid reader produces one unit per cell', grid.length === 160, `${grid.length} for 16x10`);
T('every unit carries measurements', grid.every(u => u.sem && typeof u.sem.bright === 'number'));
T('and a source rectangle to be drawn from', grid.every(u => u.src && u.src.w > 0));
T('the measurements see the content', (() => {
  const b = grid.map(u=>u.sem.bright);
  return Math.max(...b) > 0.6 && Math.min(...b) < 0.15;
})(), `brightness spans ${Math.min(...grid.map(u=>u.sem.bright)).toFixed(2)}–${Math.max(...grid.map(u=>u.sem.bright)).toFixed(2)}`);

// 3. drawing: untransformed tiles must reconstruct the source
const direct = mk(), dctx = direct.getContext('2d',{willReadFrequently:true});
paint(dctx, W, H);
const flat = mk(), fctx = flat.getContext('2d',{willReadFrequently:true});
fctx.fillStyle='#0a0d14'; fctx.fillRect(0,0,W,H);
tl.draw(fctx, W, H, null);
T('untransformed tiles reconstruct the source', diff(dctx, fctx) < W*H*0.01,
  `${diff(dctx,fctx)} of ${W*H} pixels differ — tiles are patches of the real frame, not redrawn`);
T('and they cover it', ink(fctx) > ink(dctx) * 0.97,
  `${ink(fctx)} vs ${ink(dctx)} lit pixels`);

// 4. THE POINT: a layout operator moves tiles
const sf = surfIdentity();
const rotAll = [{ op:'rotate', a:18, f:0, mode:'alternate', from:'index', scale:1,
                  target:'all', match:{ t:'kind', v:'tile' }, _y:0 }];
const moved = mk(), mctx = moved.getContext('2d',{willReadFrequently:true});
mctx.fillStyle='#0a0d14'; mctx.fillRect(0,0,W,H);
tl.draw(mctx, W, H, u => applySurfaceStack(u, rotAll, 0, tl.w, tl.h, sf));
T('a layout operator moves the tiles', diff(fctx, mctx) > W*H*0.08,
  `${diff(fctx,mctx)} pixels differ — the screen shatters into turning squares`);

// 5. selecting a subset touches less of the frame
const bright = [{ ...rotAll[0], match:{ t:'and', a:{ t:'kind', v:'tile' },
                                        b:{ t:'range', k:'bright', lo:0.55, hi:1 } } }];
const sub = mk(), sctx = sub.getContext('2d',{willReadFrequently:true});
sctx.fillStyle='#0a0d14'; sctx.fillRect(0,0,W,H);
tl.draw(sctx, W, H, u => applySurfaceStack(u, bright, 0, tl.w, tl.h, sf));
const nBright = grid.filter(u => matches(bright[0].match, u)).length;
T('selecting only bright tiles moves fewer of them', diff(fctx,sctx) < diff(fctx,mctx) * 0.8,
  `${nBright} of ${grid.length} tiles selected; ${diff(fctx,sctx)} vs ${diff(fctx,mctx)} pixels changed`);
T('and the selection is the one the patch asked for', nBright > 0 && nBright < grid.length,
  `every tile brighter than 0.55`);

// 6. regions
const reg = tl.sample(paint, [{ kind:'regions', cols:32, rows:20, tol:0.08, min:3, max:40, ax:0,ay:0,aw:1,ah:1 }], W, H);
T('a region reader finds coherent areas', reg.length >= 3 && reg.length <= 40,
  `${reg.length} regions from 10 blocks on a dark ground`);
T('regions are addressable the same way', reg.every(u => matches({t:'kind',v:'region'}, u)));
const rc = mk(), rctx = rc.getContext('2d',{willReadFrequently:true});
rctx.fillStyle='#0a0d14'; rctx.fillRect(0,0,W,H);
tl.draw(rctx, W, H, null);
T('and they draw', ink(rctx) > 10000, `${ink(rctx)} lit pixels`);

// 7. area restriction
const half = tl.sample(paint, [{ kind:'grid', cols:8, rows:8, ax:0, ay:0, aw:0.5, ah:1 }], W, H);
T('an area restricts the reader to part of the screen',
  half.every(u => u.x + u.w <= tl.w/2 + 0.01),
  `all 64 tiles inside the left half (x <= ${tl.w/2})`);

// 8. cost
{
  const t0 = performance.now();
  for (let k=0;k<20;k++) tl.sample(paint, [{ kind:'grid', cols:32, rows:20, ax:0,ay:0,aw:1,ah:1 }], W, H);
  const readMs = (performance.now()-t0)/20;
  const t1 = performance.now();
  for (let k=0;k<20;k++) { mctx.fillStyle='#0a0d14'; mctx.fillRect(0,0,W,H);
    tl.draw(mctx, W, H, u => applySurfaceStack(u, rotAll, k/60, tl.w, tl.h, sf)); }
  const drawMs = (performance.now()-t1)/20;
  T('read + draw a 640-tile screen, per frame', readMs + drawMs < 24,
    `${readMs.toFixed(1)} ms read + ${drawMs.toFixed(1)} ms draw = ${(readMs+drawMs).toFixed(1)} ms`);
}

for (const c of [direct, flat, moved, sub]) document.getElementById('c').appendChild(c);
const p = r.tests.filter(t=>t.pass).length;
r.summary = `${p}/${r.tests.length}`;
document.getElementById('o').innerHTML += `\n\n${r.summary}`;
fetch('/selftest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)});
</script></body></html>
