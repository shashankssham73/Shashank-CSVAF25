<!DOCTYPE html>
<meta charset="utf-8">
<title>M0 scope — raw machine signals</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0b0d10; color:#c9d1d9;
         font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { position:sticky; top:0; z-index:2; background:#0b0d10ee; backdrop-filter:blur(8px);
           border-bottom:1px solid #1e242c; padding:8px 12px; display:flex; gap:10px;
           align-items:center; flex-wrap:wrap; }
  h1 { font-size:12px; margin:0 8px 0 0; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:#7d8796; }
  select,input,button { background:#141922; color:#c9d1d9; border:1px solid #242c38;
                        border-radius:5px; padding:4px 8px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:#3d4a5c; }
  button.on { background:#b23b3b; border-color:#d04a4a; color:#fff; }
  #sources { display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; }
  .src { padding:2px 7px; border-radius:4px; border:1px solid #242c38; font-size:10px; letter-spacing:.03em; }
  .ok{color:#4ec98a;border-color:#1d4a35} .warn,.waiting{color:#d8a53c;border-color:#4a3c18}
  .failed,.exited,.missing,.needs-root{color:#e5636a;border-color:#4a1f22}
  .starting{color:#6b7684}
  #wrap { padding:4px 0 40px; }
  canvas { display:block; width:100%; }
  footer { position:fixed; bottom:0; left:0; right:0; background:#0b0d10ee; backdrop-filter:blur(8px);
           border-top:1px solid #1e242c; padding:5px 12px; font-size:11px; color:#6b7684;
           display:flex; gap:16px; }
  footer b { color:#9aa5b4; font-weight:500; }
</style>

<header>
  <h1>M0 scope</h1>
  <select id=mode>
    <option value=auto>auto-scale (window min/max)</option>
    <option value=log>log1p + auto-scale</option>
    <option value=norm>rolling p2–p98 normalize</option>
    <option value=hint>fixed hint range</option>
  </select>
  <input id=filter placeholder="filter channels…" size=18>
  <button id=pause>pause</button>
  <button id=rec>● record</button>
  <span id=fps></span>
  <div id=sources></div>
</header>
<div id=wrap><canvas id=cv></canvas></div>
<footer>
  <span>top talker <b id=talker>-</b></span>
  <span>busiest <b id=busiest>-</b></span>
  <span>last file <b id=lastfile>-</b></span>
</footer>

<script>
const N = 900;                       // samples held per channel (~30 s @ 30 Hz)
const ROW = 26, PAD = 92, LBL = 230; // row height, right pad, label gutter
const KINDC = { rate:'#4ec98a', level:'#5aa9e6', event:'#e0a33c', state:'#b07cd8', counter:'#e5636a' };

let schema = {}, order = [], buf = {}, latest = {}, labels = {};
let paused = false, recording = false, frames = 0, lastFps = performance.now(), fps = 0;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

fetch('/schema').then(r => r.json()).then(s => {
  schema = s.channels;
  order = Object.keys(schema);
  for (const k of order) buf[k] = new Float64Array(N);
  resize();
});

function resize() {
  const dpr = devicePixelRatio || 1;
  const rows = visible().length;
  cv.style.height = (rows * ROW) + 'px';
  cv.width = Math.floor(cv.clientWidth * dpr);
  cv.height = Math.floor(rows * ROW * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);

function visible() {
  const f = $('filter').value.trim().toLowerCase();
  return order.filter(k => !f || k.toLowerCase().includes(f));
}
$('filter').oninput = resize;
$('mode').onchange = () => {};
$('pause').onclick = e => { paused = !paused; e.target.classList.toggle('on', paused); e.target.textContent = paused ? 'resume' : 'pause'; };
$('rec').onclick = e => {
  recording = !recording;
  fetch('/record?on=' + (recording ? 1 : 0)).then(r => r.json()).then(j => {
    e.target.classList.toggle('on', !!j.recording);
    e.target.textContent = j.recording ? '■ recording' : '● record';
    if (j.file && !j.recording) console.log('wrote', j.file);
  });
};

// ---- stream
const es = new EventSource('/stream');
es.onmessage = ev => {
  if (paused) return;
  const f = JSON.parse(ev.data);
  latest = f.ch; labels = f.lab || {};
  for (const k in buf) {
    const b = buf[k];
    b.copyWithin(0, 1);
    b[N - 1] = f.ch[k] || 0;
  }
  frames++;
};
es.addEventListener('status', ev => {
  const s = JSON.parse(ev.data);
  $('sources').innerHTML = Object.entries(s).map(([n, v]) =>
    `<span class="src ${v.status}" title="${(v.note||'').replace(/"/g,'')}">${n} ${v.status}</span>`).join('');
});

// ---- scaling modes. This is the §B1 lesson made visible: switch between modes
// and watch which signals are unreadable raw and legible under log/normalize.
function scaleFor(k, b) {
  const mode = $('mode').value;
  if (mode === 'hint' && schema[k].hint) return { lo: schema[k].hint[0], hi: schema[k].hint[1], f: x => x };
  if (mode === 'log') {
    const f = x => Math.sign(x) * Math.log1p(Math.abs(x));
    let lo = Infinity, hi = -Infinity;
    for (let i = 0; i < N; i++) { const v = f(b[i]); if (v < lo) lo = v; if (v > hi) hi = v; }
    return { lo, hi, f };
  }
  if (mode === 'norm') {
    const s = Array.from(b).sort((a, c) => a - c);
    return { lo: s[Math.floor(N * 0.02)], hi: s[Math.floor(N * 0.98)], f: x => x };
  }
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < N; i++) { const v = b[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  return { lo, hi, f: x => x };
}

function fmt(v) {
  const a = Math.abs(v);
  if (a >= 1e9) return (v/1e9).toFixed(1)+'G';
  if (a >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (a >= 1e3) return (v/1e3).toFixed(1)+'k';
  if (a >= 10)  return v.toFixed(0);
  if (a >= 1)   return v.toFixed(2);
  if (a === 0)  return '0';
  return v.toFixed(3);
}

function draw() {
  const vis = visible();
  if (cv.height !== Math.floor(vis.length * ROW * (devicePixelRatio||1))) resize();
  const W = cv.clientWidth, plotW = W - LBL - PAD;
  ctx.clearRect(0, 0, W, vis.length * ROW);

  vis.forEach((k, r) => {
    const y0 = r * ROW, b = buf[k];
    if (!b) return;
    const meta = schema[k], col = KINDC[meta.kind] || '#8b949e';

    if (r % 2) { ctx.fillStyle = '#10141a'; ctx.fillRect(0, y0, W, ROW); }

    ctx.fillStyle = '#7d8796'; ctx.font = '11px ui-monospace,Menlo,monospace';
    ctx.fillText(k, 10, y0 + 17);
    ctx.fillStyle = col; ctx.fillRect(LBL - 56, y0 + 8, 5, 10);
    ctx.fillStyle = '#4a515c'; ctx.font = '9px ui-monospace,Menlo,monospace';
    ctx.fillText(meta.kind, LBL - 46, y0 + 17);

    const { lo, hi, f } = scaleFor(k, b);
    const span = (hi - lo) || 1;
    const yv = v => y0 + ROW - 4 - ((f(v) - lo) / span) * (ROW - 8);

    ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(LBL, y0 + ROW - 0.5); ctx.lineTo(LBL + plotW, y0 + ROW - 0.5); ctx.stroke();

    ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const x = LBL + (i / (N - 1)) * plotW;
      const y = Math.max(y0 + 2, Math.min(y0 + ROW - 2, yv(b[i])));
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();

    const v = latest[k] ?? 0;
    ctx.fillStyle = '#c9d1d9'; ctx.font = '11px ui-monospace,Menlo,monospace';
    ctx.textAlign = 'right';
    ctx.fillText(fmt(v), W - 34, y0 + 17);
    ctx.fillStyle = '#4a515c'; ctx.textAlign = 'left';
    ctx.fillText(meta.unit, W - 30, y0 + 17);
    ctx.textAlign = 'left';
  });

  $('talker').textContent   = labels['net.top_talker'] || '-';
  $('busiest').textContent  = (labels['proc.top_name'] || '-') + ' ' + fmt(latest['proc.top_cpu_pct'] || 0) + '%';
  $('lastfile').textContent = labels['fs.last_path'] || '-';

  const now = performance.now();
  if (now - lastFps > 500) { fps = frames * 1000 / (now - lastFps); frames = 0; lastFps = now; $('fps').textContent = fps.toFixed(0) + ' fps in'; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
